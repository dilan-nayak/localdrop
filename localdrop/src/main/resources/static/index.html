<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalDrop - Secure LAN Share</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell py-4 py-md-5">
    <div class="container">
        <header class="hero mb-4">
            <div>
                <p class="eyebrow mb-1">Local-first transfer</p>
                <h1 class="mb-2">LocalDrop</h1>
                <p class="hero-subtitle mb-0">Encrypted file sharing and live LAN chat without cloud.</p>
            </div>
            <button class="btn btn-refresh" id="refreshBtn">Refresh</button>
        </header>

        <main class="row g-4">
            <section class="col-12 col-lg-6">
                <div class="panel h-100">
                    <div class="panel-head">
                        <h2>File Sharing</h2>
                        <span class="chip">AES + RSA</span>
                    </div>

                    <label class="field-label mt-3 mb-2" for="peerKey">Target Public Key (optional)</label>
                    <textarea id="peerKey" class="form-control key-input" rows="3" placeholder="Leave empty to use this server's key automatically."></textarea>

                    <div class="mt-2 d-flex gap-2 flex-wrap">
                        <button class="btn btn-soft btn-sm" id="useMyKeyBtn" type="button">Use My Key</button>
                        <button class="btn btn-soft btn-sm" id="copyKeyBtn" type="button">Copy My Key</button>
                    </div>

                    <div class="drop-zone mt-3" id="drop-zone">
                        <input type="file" id="fileInput" hidden>
                        <p class="mb-1 drop-title">Drop a file here</p>
                        <p class="mb-0 drop-subtitle">or click to browse from your device</p>
                    </div>

                    <div id="uploadStatus" class="upload-status mt-2"></div>

                    <div class="file-list-wrap mt-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h3 class="section-title mb-0">Available Files</h3>
                        </div>
                        <ul id="fileList" class="list-unstyled file-list mb-0"></ul>
                    </div>
                </div>
            </section>

            <section class="col-12 col-lg-6">
                <div class="panel h-100">
                    <div class="panel-head">
                        <h2>Clipboard Sync</h2>
                        <span class="chip" id="presenceChip">Live</span>
                    </div>

                    <div class="identity-row mt-3">
                        <label class="field-label mb-1" for="nicknameInput">Nickname</label>
                        <div class="d-flex gap-2">
                            <input class="form-control nickname-input" id="nicknameInput" maxlength="24" />
                            <button class="btn btn-soft" id="saveNicknameBtn" type="button">Save</button>
                        </div>
                    </div>

                    <div class="chat-log mt-3" id="chatLog"></div>

                    <div class="mt-3">
                        <label class="field-label mb-2" for="clipboard">Message</label>
                        <textarea id="clipboard" class="form-control chat-input" rows="2" placeholder="Type message and press Enter..."></textarea>
                    </div>

                    <div class="mt-2 d-flex gap-2">
                        <button class="btn btn-primary" id="sendBtn" type="button">Send</button>
                        <button class="btn btn-soft" id="clearChatBtn" type="button">Clear Local View</button>
                    </div>
                </div>
            </section>
        </main>

        <section class="panel mt-4">
            <div class="panel-head">
                <h2>Your Public Key</h2>
            </div>
            <pre id="myPublicKey" class="public-key mt-3 mb-0"></pre>
        </section>
    </div>
</div>

<template id="fileItemTemplate">
    <li class="file-item">
        <div class="file-meta">
            <p class="file-name mb-0"></p>
            <p class="file-size mb-0"></p>
        </div>
        <a class="btn btn-soft btn-sm download-btn">Download</a>
    </li>
</template>

<template id="chatMessageTemplate">
    <div class="chat-row">
        <div class="chat-bubble">
            <p class="chat-content mb-1"></p>
            <div class="chat-meta">
                <small class="chat-time"></small>
                <small class="chat-status"></small>
            </div>
        </div>
    </div>
</template>

<script src="assets/js/main.js"></script>
</body>
</html>
