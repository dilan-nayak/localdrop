<!-- app.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalDrop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">🔒 LocalDrop</h3>
        <button class="btn btn-sm btn-outline-secondary" onclick="location.reload()">🔁 Refresh</button>
    </div>

    <div class="row">
        <!-- Left: File Sharing -->
        <div class="col-md-6 mb-4">
            <h5>📂 File Sharing</h5>
            <textarea id="peerKey" class="form-control mb-2" rows="2" placeholder="Paste peer's public key here..."></textarea>
            <div class="drop-zone mb-3 p-4 text-center border border-secondary rounded" id="drop-zone">
                <div>Drop a file here or click to browse</div>
                <input type="file" id="fileInput" hidden>
            </div>
            <div id="uploadStatus" class="text-success small mb-2"></div>
            <ul id="fileList" class="list-group small"></ul>
        </div>

        <!-- Right: Clipboard Chat -->
        <div class="col-md-6 mb-4">
            <h5>💬 Clipboard Sync</h5>
            <div class="border rounded mb-2 p-2 bg-light" id="chatLog" style="height: 200px; overflow-y: auto;"></div>
            <textarea id="clipboard" class="form-control mb-2" rows="2" placeholder="Type a message..."></textarea>
            <button class="btn btn-primary btn-sm" id="sendBtn">Send to Peers</button>
        </div>
    </div>

    <div class="mt-4">
        <h6>Your Public Key:</h6>
        <pre id="myPublicKey" class="bg-light p-2 small"></pre>
    </div>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
